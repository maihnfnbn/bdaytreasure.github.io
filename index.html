    }

    #wrongOverlay {

        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;

<body>

```
<!-- Confetti -->
<canvas id="confettiCanvas"></canvas>

<!-- Main Game Box -->
<div class="container" id="gameBox">
    <h1>Treasure Hunt</h1>
    <p>Enter the secret key to unlock the final prize:</p>

    <input
        type="text"
        id="keyInput"
        placeholder="Enter key here..."
    >

    <br>

    <button onclick="checkKey()">Unlock</button>
</div>

<!-- Victory Screen -->
<div class="container" id="victoryPage">
    <h1>🎉 Success!</h1>
    <p>You found the treasure! Scan the QR code below:</p>

    <img
        src="qrcode.jpg"
        alt="Secret QR Code"
        class="qr-image"
    >
</div>

<!-- Full Screen Wrong Overlay -->
<div id="wrongOverlay">
    <img src="wrong.png" alt="Incorrect Answer!">
    <h>Is you sure?</h>
</div>

<script>
    // ==============================
    // CONFETTI SETUP
    // ==============================

    const confettiCanvas = document.getElementById("confettiCanvas");
    const ctx = confettiCanvas.getContext("2d");

    let confettiPieces = [];
    let confettiAnimation;

    function resizeCanvas() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function createConfetti() {
        confettiPieces = [];

        const colors = [
            "#ffcc00",
            "#ff4d4d",
            "#4dd2ff",
            "#66ff66",
            "#ff66cc",
            "#ffffff"
        ];

        for (let i = 0; i < 180; i++) {
            confettiPieces.push({
                x: Math.random() * confettiCanvas.width,
                y: Math.random() * -confettiCanvas.height,
                width: Math.random() * 8 + 5,
                height: Math.random() * 14 + 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                speedY: Math.random() * 4 + 3,
                speedX: Math.random() * 4 - 2,
                rotation: Math.random() * 360,
                rotationSpeed: Math.random() * 8 - 4,
                gravity: 0.05
            });
        }
    }

    function animateConfetti() {
        ctx.clearRect(
            0,
            0,
            confettiCanvas.width,
            confettiCanvas.height
        );

        let piecesStillFalling = false;

        confettiPieces.forEach(piece => {
            piece.speedY += piece.gravity;
            piece.y += piece.speedY;
            piece.x += piece.speedX;
            piece.rotation += piece.rotationSpeed;

            if (piece.y < confettiCanvas.height + 50) {
                piecesStillFalling = true;
            }

            ctx.save();

            ctx.translate(
                piece.x,
                piece.y
            );

            ctx.rotate(
                piece.rotation * Math.PI / 180
            );

            ctx.fillStyle = piece.color;

            ctx.fillRect(
                -piece.width / 2,
                -piece.height / 2,
                piece.width,
                piece.height
            );

            ctx.restore();
        });

        if (piecesStillFalling) {
            confettiAnimation = requestAnimationFrame(animateConfetti);
        } else {
            ctx.clearRect(
                0,
                0,
                confettiCanvas.width,
                confettiCanvas.height
            );
        }
    }

    function launchConfetti() {
        cancelAnimationFrame(confettiAnimation);
        createConfetti();
        animateConfetti();
    }


    // ==============================
    // CHECK ANSWER
    // ==============================

    function checkKey() {

        // CHANGE THIS TO WHATEVER KEY YOU WANT
        const correctKey = "JDIJYK";

        const userInput = document
            .getElementById("keyInput")
            .value
            .trim()
            .toLowerCase();

        const gameBox = document.getElementById("gameBox");
        const victoryPage = document.getElementById("victoryPage");
        const wrongOverlay = document.getElementById("wrongOverlay");

        if (userInput.toLowerCase() === correctKey.toLowerCase()) {

            // Show confetti
            launchConfetti();

            // Hide input box
            gameBox.style.display = "none";

            // Show victory page
            victoryPage.style.display = "block";

        } else {

            // Show the overlay instantly
            wrongOverlay.classList.add("show-instant");

            // Wait 1 second, then fade away
            setTimeout(() => {
                wrongOverlay.classList.remove("show-instant");
            }, 1000);
        }
    }


    // Allow Enter key to submit the answer
    document
        .getElementById("keyInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                checkKey();
            }

        });
</script>

</body>
</html>
